<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advance Happy Birthday My SK</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff758c,#ff7eb3);
            font-family:Arial,sans-serif;
            text-align:center;
            color:white;
            overflow:hidden;
        }

        .card{
            width:90%;
            max-width:500px;
            background:rgba(255,255,255,0.15);
            padding:35px 25px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
            backdrop-filter:blur(8px);
            z-index:2;
        }

        h1{
            font-size:40px;
            margin-bottom:20px;
            text-shadow:0 0 15px rgba(255,255,255,0.8);
        }

        p{
            font-size:20px;
            line-height:1.6;
            margin-bottom:25px;
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:25px;
            background:white;
            color:#ff4081;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#ffe0ec;
            transform:scale(1.08);
        }

        #message{
            display:none;
            margin-top:25px;
            font-size:20px;
            line-height:1.6;
            animation:fadeIn 1s ease;
        }

        .heart{
            position:absolute;
            bottom:-50px;
            font-size:25px;
            animation:float 6s linear infinite;
            opacity:0.8;
        }

        .h1{left:10%;animation-delay:0s;}
        .h2{left:30%;animation-delay:2s;}
        .h3{left:50%;animation-delay:1s;}
        .h4{left:70%;animation-delay:3s;}
        .h5{left:90%;animation-delay:4s;}

        @keyframes float{
            0%{
                transform:translateY(0);
                opacity:0;
            }

            20%{
                opacity:1;
            }

            100%{
                transform:translateY(-110vh);
                opacity:0;
            }
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(15px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* Mobile */
        @media(max-width:600px){

            .card{
                padding:30px 18px;
            }

            h1{
                font-size:30px;
            }

            p{
                font-size:17px;
            }

            button{
                font-size:16px;
                padding:11px 22px;
            }

            #message{
                font-size:17px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🎂 Advance Happy Birthday My SK 🎉</h1>

        <p>
            Wishing you endless happiness,
            beautiful moments and lots of success! 💖✨
        </p>

        <button onclick="showMessage()">
            Open Your Surprise 💝
        </button>

        <div id="message">
            💕 You are truly special! 💕<br><br>

            May every dream of yours come true,
            and may your birthday be filled with
            love, smiles and unforgettable memories. 🎂✨<br><br>

            <strong>Advance Happy Birthday, My SK! ❤️</strong>
        </div>

    </div>

    <!-- Floating Hearts -->

    <div class="heart h1">❤️</div>
    <div class="heart h2">💖</div>
    <div class="heart h3">💕</div>
    <div class="heart h4">💗</div>
    <div class="heart h5">💞</div>


    <script>

        function showMessage(){

            document.getElementById("message").style.display = "block";

        }

    </script>

</body>
</html>
